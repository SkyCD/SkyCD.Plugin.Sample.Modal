name: Publish marketplace feed

on:
  push:
    branches: [main]
    paths: ['.github/marketplace-feed.py', '.github/workflows/marketplace-pages.yml']
  release:
    types: [published]
  workflow_run:
    workflows: ['Plugin NuGet']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && (github.event.workflow_run.event == 'workflow_dispatch' || startsWith(github.event.workflow_run.head_branch, 'v')))
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: SkyCD/marketplace-feed-action/.github/workflows/publish.yml@v1.2.0
    with:
      publish: true
      display-name: Sample Modal
