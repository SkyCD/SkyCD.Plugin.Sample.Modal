name: Plugin NuGet

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Published marketplace version to mirror to GitHub Packages
        type: string
        required: false

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      NuGetPackageSourceCredentials_skycd: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic
      PLUGIN_ID: SkyCD.Plugin.Sample.Modal
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.version && format('v{0}', inputs.version) || github.ref }}
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore --locked-mode
      - run: dotnet format --verify-no-changes --no-restore --verbosity minimal
      - run: dotnet pack --configuration Release --no-restore --output artifacts
      - name: Validate the tag and select the release package
        if: github.ref_type == 'tag' || inputs.version != ''
        shell: pwsh
        env:
          PUBLISH_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE) { throw 'Release tags must point to a commit on main.' }

          $project = "$env:PLUGIN_ID.csproj"
          $version = (dotnet msbuild $project -getProperty:PackageVersion).Trim()
          if ($LASTEXITCODE) { throw 'Unable to read the package version.' }
          $tag = if ($env:PUBLISH_VERSION) { "v$env:PUBLISH_VERSION" } else { $env:GITHUB_REF_NAME }
          if ($tag -ne "v$version") { throw "Tag $tag does not match project version $version." }

          $file = "$env:PLUGIN_ID.$version.nupkg"
          New-Item -ItemType Directory publish | Out-Null
          gh release download $tag --pattern $file --dir publish 2>$null
          if ($LASTEXITCODE -ne 0) {
            Copy-Item -LiteralPath "artifacts/$file" -Destination "publish/$file"
          }
      - uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag' || inputs.version != ''
        with:
          name: plugin-nuget
          path: publish/*.nupkg
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag' || inputs.version != ''
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v8
        with:
          name: plugin-nuget
          path: publish
      - name: Publish to SkyCD GitHub Packages
        env:
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push publish/*.nupkg --source https://nuget.pkg.github.com/SkyCD/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [ -n "$PUBLISH_VERSION" ]; then
            tag="v$PUBLISH_VERSION"
          fi
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" publish/*.nupkg --repo "$GITHUB_REPOSITORY" --verify-tag --title "$tag" --generate-notes
          else
            for package in publish/*.nupkg; do
              name="${package##*/}"
              if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$name"; then
                gh release upload "$tag" "$package" --repo "$GITHUB_REPOSITORY"
              fi
            done
          fi
